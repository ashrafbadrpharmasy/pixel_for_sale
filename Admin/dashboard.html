<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel 4 Sale — Dashboard</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;color:#111827}.top{background:#071a36;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20}.top h1{font-size:22px;margin:0}.top button{padding:9px 14px;border:0;border-radius:9px;background:#fff;color:#071a36;cursor:pointer}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat,.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 5px 20px #0000000d;margin-bottom:14px}.stat b{font-size:23px;display:block;color:#0d47a1;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,.toolbar button{padding:10px;border:1px solid #ddd;border-radius:9px;background:#fff}.toolbar input{flex:1;min-width:220px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button,.actions a button{padding:9px 12px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.ok{background:#16834b;color:#fff}.no{background:#dc2626;color:#fff}.wa{background:#128c7e;color:#fff}.muted{color:#64748b}.proof,.adimg{max-width:100%;max-height:240px;border-radius:10px;margin:8px 0}.pixels{font-size:12px;line-height:1.7;max-height:100px;overflow:auto;background:#f8fafc;padding:8px;border-radius:8px;word-break:break-word}.leaderboard{overflow:auto}.leaderboard table{width:100%;border-collapse:collapse;min-width:650px}.leaderboard th,.leaderboard td{padding:11px 9px;border-bottom:1px solid #e5e7eb;text-align:right}.leaderboard th{background:#f8fafc}.rank{font-weight:bold;color:#0d47a1}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px}.status-pending{color:#b45309}.status-accepted{color:#16834b}.status-rejected{color:#dc2626}
@media(max-width:800px){.top{padding:13px 12px}.top h1{font-size:17px}.wrap{padding:0 10px;margin-top:14px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px;border-radius:12px}.stat b{font-size:19px}.stat span{font-size:12px}.grid{grid-template-columns:1fr}.card{padding:14px}.toolbar{margin:10px 0}.toolbar input{min-width:100%}.leaderboard{margin-left:-4px;margin-right:-4px}}
</style></head><body><div class="top"><h1>لوحة موظف Pixel 4 Sale</h1><button onclick="logout()">خروج</button></div><main class="wrap">
<div class="stats"><div class="stat"><b id="pending">0</b><span>طلبات معلقة</span></div><div class="stat"><b id="accepted">0</b><span>طلبات مقبولة</span></div><div class="stat"><b id="rejected">0</b><span>طلبات مرفوضة</span></div><div class="stat"><b id="support">0</b><span>رسائل دعم جديدة</span></div><div class="stat"><b id="soldPixels">0</b><span>إجمالي البيكسلات المباعة</span></div></div>
<section class="card"><h2>أكبر المشترين</h2><p class="muted">الترتيب بيتحسب من الطلبات المقبولة فقط، وكل مشتريات الحساب بتتجمع تلقائياً.</p><div id="leaderboard" class="leaderboard">جاري التحميل...</div></section>
<div class="toolbar"><input id="search" placeholder="بحث برقم الطلب أو العميل أو الإعلان"><select id="filter"><option value="all">كل الطلبات</option><option value="pending">معلقة</option><option value="accepted">مقبولة</option><option value="rejected">مرفوضة</option></select><button onclick="load()">تحديث</button></div>
<h2>الطلبات</h2><div id="orders">جاري التحميل...</div><h2>رسائل الدعم</h2><div id="supportList">جاري التحميل...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://uklivylyenatdqbgmcxy.supabase.co','sb_publishable_ntlKWYQvMXlCs_obIEVIIA_-CfxOFTJ');let all=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escAttr=s=>String(s??'').replace(/['\\]/g,c=>c==='\\'?'\\\\':"\\'");
async function auth(){const s=await db.auth.getSession();if(!s.data.session){location.href='/Admin/login.html';return false}return true}
async function load(){if(!(await auth()))return;const[o,s,l]=await Promise.all([db.from('pixel_orders').select('*').order('created_at',{ascending:false}),db.from('support_messages').select('*').order('created_at',{ascending:false}),db.rpc('get_customer_leaderboard')]);if(o.error){orders.textContent=o.error.message;return}all=o.data||[];const count=x=>all.filter(o=>o.status===x).length;pending.textContent=count('pending');accepted.textContent=count('accepted');rejected.textContent=count('rejected');support.textContent=(s.data||[]).filter(x=>x.status==='new').length;soldPixels.textContent=all.filter(x=>x.status==='accepted').reduce((a,x)=>a+(x.pixel_count||0),0).toLocaleString('en-US');renderOrders();renderSupport(s.data||[]);renderLeaderboard(l.data||[],l.error)}
function renderLeaderboard(rows,error){if(error){leaderboard.innerHTML='<div class="muted">تعذر تحميل الترتيب: '+esc(error.message)+'</div>';return}if(!rows.length){leaderboard.innerHTML='<div class="muted">لسه مفيش مشتريات مقبولة.</div>';return}leaderboard.innerHTML='<table><thead><tr><th>#</th><th>العميل</th><th>الموبايل</th><th>البيكسلات</th><th>الإنفاق</th><th>الطلبات</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td class="rank">'+(i+1)+'</td><td><b>'+esc(r.display_name||'عميل')+'</b></td><td>'+esc(r.phone||'—')+'</td><td><b>'+Number(r.total_pixels||0).toLocaleString('en-US')+'</b></td><td>'+Number(r.total_spent||0).toLocaleString('en-US')+' جنيه</td><td>'+Number(r.accepted_orders||0)+'</td></tr>').join('')+'</tbody></table>'}
function renderOrders(){const q=search.value.trim().toLowerCase(),f=filter.value;const rows=all.filter(o=>(f==='all'||o.status===f)&&(!q||[o.order_number,o.customer_name,o.customer_phone,o.ad_name].join(' ').toLowerCase().includes(q)));orders.innerHTML=rows.length?'<div class="grid">'+rows.map(o=>'<article class="card"><h3>'+esc(o.order_number)+' <small class="status-'+esc(o.status)+'">'+esc(o.status)+'</small></h3><p><b>العميل:</b> '+esc(o.customer_name)+' — '+esc(o.customer_phone)+'</p><p><b>الإعلان:</b> '+esc(o.ad_name)+'</p><p>'+esc(o.ad_text||'')+'</p><p><b>البيكسلات:</b> '+o.pixel_count+' — <b>الإجمالي:</b> '+o.total_price+' جنيه</p><p><b>الدفع:</b> '+esc(o.payment_method==='other'?o.other_payment:'InstaPay')+'</p>'+(o.ad_link?'<p><a href="'+esc(o.ad_link)+'" target="_blank" rel="noopener">رابط الإعلان</a></p>':'')+(o.ad_image_path?'<img class="adimg" src="'+db.storage.from('ad-images').getPublicUrl(o.ad_image_path).data.publicUrl+'">':'')+(o.payment_proof_path?'<p><button onclick="openProof(\''+escAttr(o.payment_proof_path)+'\')">فتح إثبات الدفع</button></p>':'')+'<div class="pixels">'+(o.selected_pixels||[]).join(', ')+'</div><div class="actions">'+(o.status==='pending'?'<button class="ok" onclick="acceptOrder('+o.id+')">قبول ونشر تلقائياً</button><button class="no" onclick="rejectOrder('+o.id+')">رفض</button>':'')+'<a href="https://wa.me/2'+String(o.customer_phone||'').replace(/\\D/g,'')+'" target="_blank" rel="noopener"><button class="wa">واتساب</button></a></div></article>').join('')+'</div>':'<div class="card">لا توجد طلبات.</div>'}
async function openProof(path){const{data,error}=await db.storage.from('payment-proofs').createSignedUrl(path,3600);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')}
async function acceptOrder(id){if(!confirm('تأكيد قبول الطلب ونشر الإعلان؟'))return;const{error}=await db.rpc('accept_pixel_order',{p_order_id:id});if(error)alert(error.message);else alert('تم القبول ونشر الإعلان على البيكسلات المحددة.');load()}
async function rejectOrder(id){if(!confirm('رفض الطلب؟'))return;const{error}=await db.from('pixel_orders').update({status:'rejected',updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);load()}
function renderSupport(rows){supportList.innerHTML=rows.length?rows.map(x=>'<div class="card"><b>'+esc(x.customer_name)+'</b> — '+esc(x.customer_phone)+'<p>'+esc(x.message)+'</p><small>'+esc(x.status)+'</small>'+(x.status==='new'?'<button onclick="doneSupport('+x.id+')">تمت المتابعة</button>':'')+'</div>').join(''):'<div class="card">لا توجد رسائل.</div>'}
async function doneSupport(id){await db.from('support_messages').update({status:'handled'}).eq('id',id);load()}search.oninput=renderOrders;filter.onchange=renderOrders;async function logout(){await db.auth.signOut();location.href='/Admin/login.html'}load();setInterval(load,15000)
</script></body></html>
