<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel 4 Sale — Dashboard</title><style>body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;color:#111827}.top{background:#071a36;color:#fff;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0000000d;margin-bottom:15px}.stat b{font-size:25px;display:block}.card h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:15px}.actions button{padding:10px 15px;border:0;border-radius:9px;cursor:pointer;font-weight:bold;margin:4px}.ok{background:#16834b;color:#fff}.no{background:#dc2626;color:#fff}.wa{background:#128c7e;color:#fff}.muted{color:#64748b}.proof,.adimg{max-width:100%;max-height:240px;border-radius:10px;margin:8px 0}.pixels{font-size:12px;line-height:1.7;max-height:100px;overflow:auto;background:#f8fafc;padding:8px;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:9px}</style></head><body><div class="top"><h1>لوحة موظف Pixel 4 Sale</h1><button onclick="logout()">خروج</button></div><main class="wrap"><div class="stats"><div class="stat"><b id="pending">0</b><span>طلبات معلقة</span></div><div class="stat"><b id="accepted">0</b><span>مقبولة</span></div><div class="stat"><b id="rejected">0</b><span>مرفوضة</span></div><div class="stat"><b id="support">0</b><span>رسائل دعم جديدة</span></div></div><div class="toolbar"><input id="search" placeholder="بحث برقم الطلب أو العميل أو الإعلان"><select id="filter"><option value="all">كل الطلبات</option><option value="pending">معلقة</option><option value="accepted">مقبولة</option><option value="rejected">مرفوضة</option></select><button onclick="load()">تحديث</button></div><h2>الطلبات</h2><div id="orders">جاري التحميل...</div><h2>رسائل الدعم</h2><div id="supportList">جاري التحميل...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://uklivylyenatdqbgmcxy.supabase.co','sb_publishable_ntlKWYQvMXlCs_obIEVIIA_-CfxOFTJ');let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function auth(){const s=await db.auth.getSession();if(!s.data.session)location.href='/Admin/login.html'}async function load(){await auth();const[o,s]=await Promise.all([db.from('pixel_orders').select('*').order('created_at',{ascending:false}),db.from('support_messages').select('*').order('created_at',{ascending:false})]);if(o.error){orders.textContent=o.error.message;return}all=o.data||[];const c=x=>all.filter(o=>o.status===x).length;pending.textContent=c('pending');accepted.textContent=c('accepted');rejected.textContent=c('rejected');support.textContent=(s.data||[]).filter(x=>x.status==='new').length;renderOrders();renderSupport(s.data||[])}function renderOrders(){const q=search.value.trim().toLowerCase(),f=filter.value;const rows=all.filter(o=>(f==='all'||o.status===f)&&(!q||[o.order_number,o.customer_name,o.customer_phone,o.ad_name].join(' ').toLowerCase().includes(q)));orders.innerHTML=rows.length?'<div class="grid">'+rows.map(o=>'<article class="card"><h3>'+esc(o.order_number)+' <small>'+esc(o.status)+'</small></h3><p><b>العميل:</b> '+esc(o.customer_name)+' — '+esc(o.customer_phone)+'</p><p><b>الإعلان:</b> '+esc(o.ad_name)+'</p><p>'+esc(o.ad_text||'')+'</p><p><b>البيكسلات:</b> '+o.pixel_count+' — <b>الإجمالي:</b> '+o.total_price+' جنيه</p><p><b>الدفع:</b> '+esc(o.payment_method==='other'?o.other_payment:'InstaPay')+'</p>'+(o.ad_link?'<p><a href="'+esc(o.ad_link)+'" target="_blank">رابط الإعلان</a></p>':'')+(o.ad_image_path?'<img class="adimg" src="'+db.storage.from('ad-images').getPublicUrl(o.ad_image_path).data.publicUrl+'">':'')+(o.payment_proof_path?'<p><a target="_blank" href="'+proofUrl(o.payment_proof_path)+'">فتح إثبات الدفع</a></p>':'')+'<div class="pixels">'+(o.selected_pixels||[]).join(', ')+'</div><div class="actions">'+(o.status==='pending'?'<button class="ok" onclick="acceptOrder('+o.id+')">قبول ونشر تلقائياً</button><button class="no" onclick="rejectOrder('+o.id+')">رفض</button>':'')+'<a href="https://wa.me/2'+esc(o.customer_phone.replace(/\D/g,''))+'" target="_blank"><button class="wa">واتساب</button></a></div></article>').join('')+'</div>':'<div class="card">لا توجد طلبات.</div>'}function proofUrl(path){return db.storage.from('payment-proofs').createSignedUrl(path,3600).then(x=>x.data?.signedUrl)}async function acceptOrder(id){if(!confirm('تأكيد قبول الطلب ونشر الإعلان؟'))return;const{error}=await db.rpc('accept_pixel_order',{p_order_id:id});if(error)alert(error.message);else alert('تم القبول ونشر الإعلان على البيكسلات المحددة.');load()}async function rejectOrder(id){if(!confirm('رفض الطلب؟'))return;const{error}=await db.from('pixel_orders').update({status:'rejected',updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);load()}function renderSupport(rows){supportList.innerHTML=rows.length?rows.map(x=>'<div class="card"><b>'+esc(x.customer_name)+'</b> — '+esc(x.customer_phone)+'<p>'+esc(x.message)+'</p><small>'+esc(x.status)+'</small>'+(x.status==='new'?'<button onclick="doneSupport('+x.id+')">تمت المتابعة</button>':'')+'</div>').join(''):'<div class="card">لا توجد رسائل.</div>'}async function doneSupport(id){await db.from('support_messages').update({status:'handled'}).eq('id',id);load()}search.oninput=renderOrders;filter.onchange=renderOrders;async function logout(){await db.auth.signOut();location.href='/Admin/login.html'}load();setInterval(load,15000)</script></body></html>
