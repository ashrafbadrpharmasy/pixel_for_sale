<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Pixel 4 Sale</title><style>body{font-family:Arial;background:#f4f7fb;padding:20px}.card{background:#fff;padding:18px;margin:15px 0;border-radius:14px}button{padding:10px;border:0;border-radius:8px;cursor:pointer}.ok{background:#16834b;color:white}.no{background:#dc2626;color:white}</style></head><body><h1>لوحة موظف Pixel 4 Sale</h1><button onclick="load()">تحديث</button><button onclick="logout()">خروج</button><h2>الطلبات</h2><div id="orders">جاري التحميل...</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://uklivylyenatdqbgmcxy.supabase.co','sb_publishable_ntlKWYQvMXlCs_obIEVIIA_-CfxOFTJ');async function load(){const s=await db.auth.getSession();if(!s.data.session)return location.href='/Admin/login.html';const{data,error}=await db.from('pixel_orders').select('*').order('created_at',{ascending:false});if(error)return orders.textContent=error.message;orders.innerHTML=(data||[]).map(o=>'<div class="card"><b>'+o.order_number+'</b><p>العميل: '+o.customer_name+' — '+o.customer_phone+'</p><p>الإعلان: '+o.ad_name+'</p><p>العدد: '+o.pixel_count+' — '+o.total_price+' جنيه</p><p>الدفع: '+(o.payment_method==='other'?o.other_payment:'InstaPay')+'</p><p>البيكسلات: '+(o.selected_pixels||[]).join(', ')+'</p>'+(o.status==='pending'?'<button class="ok" onclick="accept('+o.id+')">قبول ونشر الإعلان</button> <button class="no" onclick="reject('+o.id+')">رفض</button>':'<b>الحالة: '+o.status+'</b>')+'</div>').join('')||'لا توجد طلبات'}async function accept(id){const{error}=await db.rpc('accept_pixel_order',{p_order_id:id});alert(error?error.message:'تم قبول الطلب ونشر الإعلان تلقائياً');load()}async function reject(id){const{error}=await db.from('pixel_orders').update({status:'rejected'}).eq('id',id);alert(error?error.message:'تم الرفض');load()}async function logout(){await db.auth.signOut();location.href='/Admin/login.html'}load()</script></body></html>
