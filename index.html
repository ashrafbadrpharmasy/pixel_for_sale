<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pixel 4 Sale</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">
    <div class="container">
      <div class="badge">PIXEL 4 SALE</div>

      <h1>امتلك مساحتك على لوحة الإعلانات</h1>

      <p>
        اختر مكانك، اكتب إعلانك، وخلّي مساحتك موجودة على اللوحة.
      </p>

      <div class="price-box">
        <strong>50 جنيه</strong>
        <span>سعر البكسل الواحد</span>
      </div>
    </div>
  </header>


  <main class="container">

    <section class="stats">

      <div class="stat">
        <strong id="totalPixels">10,000</strong>
        <span>إجمالي البكسلات</span>
      </div>

      <div class="stat">
        <strong id="selectedPixels">0</strong>
        <span>البكسلات المحددة</span>
      </div>

      <div class="stat">
        <strong id="totalPrice">0 جنيه</strong>
        <span>السعر الإجمالي</span>
      </div>

    </section>


    <section class="board-section">

      <h2>اختر مساحتك</h2>

      <p class="hint">
        اضغط على المربعات التي تريد شراءها.
      </p>

      <div class="board-wrapper">
        <div id="pixelBoard" class="pixel-board"></div>
      </div>

    </section>


    <section class="checkout">

      <div>
        <span>المحدد</span>
        <strong id="checkoutPixels">0 بكسل</strong>
      </div>

      <div>
        <span>الإجمالي</span>
        <strong id="checkoutPrice">0 جنيه</strong>
      </div>

      <button id="reserveButton">
        احجز المساحة
      </button>

    </section>

  </main>


  <footer>
    <p>© 2026 Pixel 4 Sale</p>
  </footer>


  <script src="app.js"></script>

</body>
</html>
